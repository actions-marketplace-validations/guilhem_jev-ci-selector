version: 1
model: jev-1.13.0
skip_below: 0.05

# Changes to CI inputs are unsafe to select semantically. They run every job.
force_all_paths:
  - .github/**
  - ci/**
  - go.mod
  - go.sum

# Keep this catalog and the job IDs in ci.yml in lockstep. The integration
# validator rejects an omitted or newly unknown task.
tasks:
  build:
    always: true
  e2e_network:
    question: Does this change affect network end-to-end behavior?
    run_if_paths:
      - pkg/network/**
    requires:
      - build
  e2e_upgrade:
    question: Does this change affect the upgrade path?
    run_if_paths:
      - internal/upgrade/**
    requires:
      - build
  helm:
    question: Does this change affect a Helm chart?
    run_if_paths:
      - charts/**
  lint:
    always: true
  unit:
    always: true
